name: Temporary lockfile refresh

on:
  push:
    branches: [fix/stackup-security-and-build]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Resolve patched dependency tree
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm audit fix --package-lock-only --no-fund || true
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh patched dependency lockfile"
          git push
